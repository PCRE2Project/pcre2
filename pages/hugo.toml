baseURL = 'https://example.org/'
languageCode = 'en-us'
title = 'PCRE2 - Perl-Compatible Regular Expressions'
disableKinds = ["taxonomy", "term", "rss"]

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = '../doc/assets/css/document.css'
    target = 'assets/css/document.css'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = '../doc/assets/images'
    target = 'static/images'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[security]
  [security.exec]
    allow = []

[params]
  release = 'Unknown'