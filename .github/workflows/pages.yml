name: Deploy Pages
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/pages/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/pages/vendor/bundle
    steps:
      - name: Setup
        run: |
          echo "set man-db/auto-update false" | sudo debconf-communicate && sudo dpkg-reconfigure man-db
          sudo apt-get -qq update
          sudo apt-get -qq install -y ruby ruby-dev ruby-bundler build-essential

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install locked website dependencies
        run: |
          bundle config set --local frozen true
          bundle install
          bundle exec ruby -rjekyll -rasciidoctor -rrouge -e \
            'puts "Jekyll #{Jekyll::VERSION}, Asciidoctor #{Asciidoctor::VERSION}, Rouge #{Rouge.version}"'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build with Jekyll
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: ruby maint/BuildPages.rb

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./pages/public

  Deploy:
    needs: Build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
