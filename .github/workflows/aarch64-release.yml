name: AArch64 release package
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload to; leave empty to skip GitHub Releases publication
        required: false
        type: string
  push:
    tags:
      - 'pcre2-*'

permissions:
  contents: write

env:
  TOOLCHAIN_VERSION: 10.3-2021.07
  TOOLCHAIN_BASE_URL: https://developer.arm.com/-/media/Files/downloads/gnu-a
  TARGET_TRIPLE: aarch64-none-linux-gnu

jobs:
  cross-build:
    name: Cross-build AArch64 package
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install file

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Download toolchain
        run: |
          TOOLCHAIN_DIR="gcc-arm-$TOOLCHAIN_VERSION-x86_64-aarch64-none-linux-gnu"
          TOOLCHAIN_URL="$TOOLCHAIN_BASE_URL/$TOOLCHAIN_VERSION/binrel/$TOOLCHAIN_DIR.tar.xz"
          curl -L --retry 5 --retry-delay 5 --fail "$TOOLCHAIN_URL" -o "$RUNNER_TEMP/$TOOLCHAIN_DIR.tar.xz"
          tar -xJf "$RUNNER_TEMP/$TOOLCHAIN_DIR.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Prepare
        run: ./autogen.sh

      - name: Configure
        run: |
          mkdir build-aarch64
          cd build-aarch64
          ../configure \
            --build="$(gcc -dumpmachine)" \
            --host="$TARGET_TRIPLE" \
            CC="$TARGET_TRIPLE-gcc" \
            AR="$TARGET_TRIPLE-ar" \
            RANLIB="$TARGET_TRIPLE-ranlib" \
            STRIP="$TARGET_TRIPLE-strip" \
            --enable-jit \
            --enable-pcre2-16 \
            --enable-pcre2-32

      - name: Build
        run: |
          cd build-aarch64
          make -j"$(nproc)"

      - name: Package
        run: |
          cd build-aarch64
          DESTDIR="$PWD/install-root"
          make install DESTDIR="$DESTDIR"

          BIN_DIR="$DESTDIR/usr/local/bin"
          LIB_DIR="$DESTDIR/usr/local/lib"
          mapfile -t BIN_ARTIFACTS < <(find "$BIN_DIR" -maxdepth 1 -type f ! -name 'pcre2-config' | sort)
          mapfile -t LIB_ARTIFACTS < <(find "$LIB_DIR" -maxdepth 1 -type f -name 'libpcre2-*.so.*' | sort -V)

          test "${#BIN_ARTIFACTS[@]}" -gt 0 || {
            echo "Error: no installed ELF binaries found in $BIN_DIR"
            exit 1
          }
          test "${#LIB_ARTIFACTS[@]}" -gt 0 || {
            echo "Error: no versioned shared libraries found in $LIB_DIR"
            exit 1
          }
          for artifact in "${BIN_ARTIFACTS[@]}" "${LIB_ARTIFACTS[@]}"; do
            FILE_OUTPUT="$(file "$artifact")"
            echo "$FILE_OUTPUT"
            echo "$FILE_OUTPUT" | grep -q 'ELF' || {
              echo "Error: $artifact is not an ELF artifact"
              exit 1
            }
            "$TARGET_TRIPLE-readelf" -h "$artifact"
            "$TARGET_TRIPLE-readelf" -h "$artifact" | grep -q 'Machine:.*AArch64' || {
              echo "Error: $artifact is not an AArch64 ELF artifact"
              exit 1
            }
          done

          VERSION="$(./pcre2-config --version)"
          PACKAGE_BASENAME="pcre2-${VERSION}-aarch64-none-linux-gnu"
          PACKAGE_FILE="$PWD/${PACKAGE_BASENAME}.tar.xz"
          tar -C "$DESTDIR" -cJf "$PACKAGE_FILE" usr/local
          sha256sum "$PACKAGE_FILE" > "$PACKAGE_FILE.sha256"

          echo "PACKAGE_FILE=$PACKAGE_FILE" >> "$GITHUB_ENV"
          echo "CHECKSUM_FILE=$PACKAGE_FILE.sha256" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: aarch64-release-package
          path: |
            ${{ env.PACKAGE_FILE }}
            ${{ env.CHECKSUM_FILE }}
          if-no-files-found: error

      - name: Resolve release tag
        if: github.event_name == 'push' || inputs.release_tag != ''
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="${{ inputs.release_tag }}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Publish release assets
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || {
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "Release '$RELEASE_TAG' does not exist. Create it first, or leave release_tag empty to keep the package as a workflow artifact only."
            else
              echo "Release '$RELEASE_TAG' does not exist. Create the GitHub Release first so this workflow can upload the AArch64 package to it."
            fi
            exit 1
          }
          gh release upload "$RELEASE_TAG" "$PACKAGE_FILE" "$CHECKSUM_FILE" --clobber
